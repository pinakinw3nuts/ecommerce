version: '3.8'

services:
  # Storefront - Customer-facing frontend (Development)
  storefront:
    build:
      context: ./apps/storefront
      dockerfile: Dockerfile.dev
    container_name: ecom-storefront-dev
    ports:
      - "3102:3100"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3000/api
    volumes:
      - ./apps/storefront:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    networks:
      - ecom-network
    restart: unless-stopped

  # Admin Panel - Admin interface (Development)
  admin:
    build:
      context: ./apps/admin-panel
      dockerfile: Dockerfile.dev
    container_name: ecom-admin-dev
    ports:
      - "3103:3200"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3000/api
    volumes:
      - ./apps/admin-panel:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    networks:
      - ecom-network
    restart: unless-stopped

  # API - Backend service (Development)
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: ecom-api-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
      - DB_NAME=ecommerce
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev-jwt-secret-key
      - JWT_REFRESH_SECRET=dev-jwt-refresh-secret-key
      - STRIPE_SECRET_KEY=sk_test_...
      - STRIPE_WEBHOOK_SECRET=whsec_...
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=dev@example.com
      - SMTP_PASS=dev-password
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3100,http://localhost:3101,http://localhost:3001
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecom-network
    restart: unless-stopped

networks:
  ecom-network:
    external: true 